<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOJS – Napló</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }
    header { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 30px 20px; text-align: center; }
    header h1 { font-size: 1.6em; }
    nav { background: #1565c0; display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; padding: 10px; }
    nav a { color: white; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: 500; }
    nav a:hover { background: #0d47a1; }
    main { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    h2 { color: #1a237e; margin-bottom: 20px; }
    canvas { display: block; margin: 0 auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .controls { display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95em; font-weight: 500; }
    .btn-primary { background: #1565c0; color: white; }
    .btn-success { background: #2e7d32; color: white; }
    .btn-danger { background: #c62828; color: white; }
    #info { text-align: center; color: #555; margin-bottom: 10px; font-size: 0.95em; }
    footer { background: #1a237e; color: white; text-align: center; padding: 15px; margin-top: 30px; }
  </style>
</head>
<body>
  <header><h1>Web programozás-1 Előadás Házi feladat</h1></header>
  <nav>
    <a href="index.html">Főoldal</a>
    <a href="javascript.html">JavaScript</a>
    <a href="react.html">React</a>
    <a href="spa.html">SPA</a>
    <a href="fetchapi.html">Fetch API</a>
    <a href="axios.html">Axios</a>
    <a href="oojs.html">OOJS</a>
  </nav>
  <main>
    <h2>OOJS – Labda szimulátor</h2>
    <p id="info">Labdák száma: <strong id="ballCount">0</strong></p>
    <div class="controls">
      <button class="btn-success" onclick="game.addBall()">+ Labda hozzáadása</button>
      <button class="btn-danger" onclick="game.clearBalls()">Törlés</button>
      <button class="btn-primary" onclick="game.togglePause()">⏸ Szünet/Folytatás</button>
    </div>
    <canvas id="canvas" width="800" height="450"></canvas>
  </main>
  <footer><p>Készítette: <strong>Kovács Máté</strong> | Neptun kód: <strong>FA98OA</strong></p></footer>
  <script>
    class Shape {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
      }
      draw(ctx) {}
    }

    class Ball extends Shape {
      constructor(x, y, radius, color, vx, vy) {
        super(x, y, color);
        this.radius = radius;
        this.vx = vx;
        this.vy = vy;
        this.gravity = 0.3;
        this.bounce = 0.75;
        this.label = Math.floor(Math.random()*5)+1;
      }

      update(width, height) {
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        if(this.x + this.radius > width) { this.x = width - this.radius; this.vx *= -this.bounce; }
        if(this.x - this.radius < 0) { this.x = this.radius; this.vx *= -this.bounce; }
        if(this.y + this.radius > height) { this.y = height - this.radius; this.vy *= -this.bounce; if(Math.abs(this.vy)<0.5) this.vy=0; }
        if(this.y - this.radius < 0) { this.y = this.radius; this.vy *= -this.bounce; }
      }

      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
        const grad = ctx.createRadialGradient(this.x-this.radius*0.3, this.y-this.radius*0.3, this.radius*0.1, this.x, this.y, this.radius);
        grad.addColorStop(0, 'white');
        grad.addColorStop(0.3, this.color);
        grad.addColorStop(1, this.darkenColor(this.color));
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = 'white';
        ctx.font = 'bold ' + (this.radius*0.8) + 'px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.label, this.x, this.y);
      }

      darkenColor(hex) {
        const r = parseInt(hex.slice(1,3),16)*0.6|0;
        const g = parseInt(hex.slice(3,5),16)*0.6|0;
        const b = parseInt(hex.slice(5,7),16)*0.6|0;
        return `rgb(${r},${g},${b})`;
      }
    }

    class Game {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.balls = [];
        this.paused = false;
        this.colors = ['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#00acc1','#e91e63','#fdd835'];
        this.animate();
      }

      addBall() {
        const r = 20 + Math.random()*20;
        const x = r + Math.random()*(this.canvas.width-2*r);
        const y = r + Math.random()*200;
        const vx = (Math.random()-0.5)*8;
        const vy = (Math.random()-0.5)*5;
        const color = this.colors[Math.floor(Math.random()*this.colors.length)];
        const b = new Ball(x, y, r, color, vx, vy);
        this.balls.push(b);
        document.getElementById('ballCount').textContent = this.balls.length;
      }

      clearBalls() {
        this.balls = [];
        document.getElementById('ballCount').textContent = 0;
      }

      togglePause() { this.paused = !this.paused; }

      drawBackground() {
        const ctx = this.ctx;
        const grad = ctx.createLinearGradient(0,0,0,this.canvas.height);
        grad.addColorStop(0,'#1a237e');
        grad.addColorStop(1,'#283593');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        for(let i=0;i<this.canvas.width;i+=50) {
          ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,this.canvas.height); ctx.stroke();
        }
        for(let i=0;i<this.canvas.height;i+=50) {
          ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(this.canvas.width,i); ctx.stroke();
        }
      }

      animate() {
        this.drawBackground();
        if(!this.paused) {
          this.balls.forEach(b => {
            b.update(this.canvas.width, this.canvas.height);
            b.draw(this.ctx);
          });
        } else {
          this.balls.forEach(b => b.draw(this.ctx));
          this.ctx.fillStyle = 'rgba(255,255,255,0.7)';
          this.ctx.font = 'bold 36px Arial';
          this.ctx.textAlign = 'center';
          this.ctx.fillText('SZÜNET', this.canvas.width/2, this.canvas.height/2);
        }
        requestAnimationFrame(() => this.animate());
      }
    }

    const game = new Game('canvas');
    for(let i=0;i<5;i++) game.addBall();
  </script>
</body>
</html>
